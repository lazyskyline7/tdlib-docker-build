name: Build and Push Multi-Arch Image

on:
  push:
    tags:
      - '*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: debian
            dockerfile: Dockerfile
            platform: linux/amd64
            runner: ubuntu-latest
          - variant: debian
            dockerfile: Dockerfile
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - variant: alpine
            dockerfile: Dockerfile.alpine
            platform: linux/amd64
            runner: ubuntu-latest
          - variant: alpine
            dockerfile: Dockerfile.alpine
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare platform pair
        id: prep
        run: echo "pair=$(echo '${{ matrix.platform }}' | tr '/' '-')" >> $GITHUB_OUTPUT

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=lazyskyline/tdlib,push-by-digest=true,name-canonical=true,push=true
          # Per-variant cache scope: musl-built layers must NEVER share cache with
          # glibc-built layers — they would produce broken images on cache hit.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/tdlib-cache:${{ matrix.variant }}-${{ steps.prep.outputs.pair }}
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/tdlib-cache:${{ matrix.variant }}-${{ steps.prep.outputs.pair }},mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.variant }}-${{ steps.prep.outputs.pair }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [debian, alpine]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download digests for this variant
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.variant }}-*
          merge-multiple: true

      - name: Create and push manifest
        env:
          VERSION: ${{ github.ref_name }}
          VARIANT: ${{ matrix.variant }}
        run: |
          cd /tmp/digests
          if [ "$VARIANT" = "debian" ]; then
            # Debian is the default — owns :latest, :<version>, :<version>-debian, :debian
            TAGS="-t lazyskyline/tdlib:latest \
                  -t lazyskyline/tdlib:${VERSION} \
                  -t lazyskyline/tdlib:${VERSION}-debian \
                  -t lazyskyline/tdlib:debian"
          else
            # Alpine is opt-in — owns :alpine, :<version>-alpine
            TAGS="-t lazyskyline/tdlib:alpine \
                  -t lazyskyline/tdlib:${VERSION}-alpine"
          fi
          docker buildx imagetools create \
            $TAGS \
            $(printf 'lazyskyline/tdlib@sha256:%s ' *)

  create-release:
    needs: merge
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute commit summary
        id: get_changes
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "Current tag: $TAG"
          git fetch --tags --force
          PREV_TAG=$(git describe --tags --abbrev=0 "$TAG"^ 2>/dev/null || git tag --sort=-creatordate | grep -v "^$TAG$" | head -n1 || true)
          if [ -n "$PREV_TAG" ]; then RANGE="$PREV_TAG..$TAG"; else RANGE="$TAG"; fi
          BODY=$(git log "$RANGE" --pretty=format:'- %s (%h) — %an')
          if [ -z "$BODY" ]; then BODY="No changes recorded."; fi
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          # Pass body via env (multiline-safe, NOT shell-interpolated). Body
          # contains upstream commit subjects which may include backticks,
          # $(...), em-dashes, etc.; interpolating via ${{ }} would let bash
          # parse them as command substitution and blow up.
          BODY: ${{ steps.get_changes.outputs.body }}
        run: |
          printf '%s\n' "$BODY" > /tmp/release-notes.md
          # Idempotent: tags get force-pushed under the dup-tag policy, so the
          # release object often already exists. Check first, then create or edit.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file /tmp/release-notes.md
          fi

  update-dockerhub-description:
    needs: merge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Update Docker Hub Description
        id: dockerhub_description
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: lazyskyline/tdlib
          readme-filepath: ./README.md

      - name: Warn when Docker Hub description update is forbidden
        if: ${{ steps.dockerhub_description.outcome == 'failure' }}
        run: |
          echo "::warning::Docker Hub description update was skipped due to insufficient permissions (Forbidden). Image publish and release creation are unaffected."
